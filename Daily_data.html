<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Daily Data - FoodWaste AI</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="Dashboard.css">
</head>
<body>

    <div class="dashboard-container">
        
        <!-- SIDEBAR OVERLAY FOR MOBILE -->
        <div id="sidebarOverlay" class="sidebar-overlay"></div>

        <!-- SIDEBAR NAVIGATION -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
    <a href="Dashboard.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; width: 100%;">
        <div class="brand-logo">
            <i class="fa-solid fa-seedling"></i>
        </div>
        <div class="brand-title">
            <h2>FoodWaste AI</h2>
            <span>Smart Analytics</span>
        </div>
    </a>
    <button class="mobile-close-btn" id="mobileCloseBtn">
        <i class="fa-solid fa-xmark"></i>
    </button>
</div>

            <nav class="sidebar-nav">
                <a href="Dashboard.html" class="nav-item">
                    <i class="fa-solid fa-chart-pie"></i> Dashboard
                </a>
                <a href="Daily_data.html" class="nav-item active">
                    <i class="fa-solid fa-circle-plus"></i> Add Daily Data
                </a>
                <a href="Food_records.html" class="nav-item">
                    <i class="fa-solid fa-utensils"></i> Food Records
                </a>
                <a href="Prediction.html" class="nav-item">
                    <i class="fa-solid fa-brain"></i> AI Predictions
                </a>
                <a href="recommendations.html" class="nav-item">
                    <i class="fa-solid fa-lightbulb"></i> Recommendations
                </a>
                <a href="Analytics.html" class="nav-item">
                    <i class="fa-solid fa-chart-line"></i> Analytics
                </a>
                <a href="reports.html" class="nav-item">
                    <i class="fa-solid fa-file-arrow-down"></i> Reports
                </a>
                <a href="settings.html" class="nav-item">
                    <i class="fa-solid fa-gear"></i> Settings
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="admin-profile">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSUy-t00mImJn20OoJQGOZ-hpNBUnrKty6pmaC96C6r_Q&s=10?auto=format&fit=crop&q=80&w=150" alt="Admin Avatar" class="admin-avatar">
                    <div class="admin-info">
                        <h4 id="sidebarAdminName">---</h4>
                    </div>
                </div>
                <button class="logout-btn" id="logoutBtn" title="Logout">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT WRAPPER -->
        <div class="main-content">
            
            <!-- TOP HEADER -->
            <header class="top-header">
                <div class="header-left">
                    <button id="sidebarToggle" class="sidebar-toggle-btn"><i class="fa-solid fa-bars"></i></button>
                    <h2>Add Daily Data</h2>
                </div>
                <div class="header-right">
                    <div class="date-display" id="currentDateDisplay" style="font-size: 13px; font-weight: 600; color: #475569; background: #f1f5f9; padding: 6px 12px; border-radius: 6px;">
                        <i class="fa-regular fa-calendar" style="margin-right: 6px; color: #10b981;"></i>Loading Date...
                    </div>
                </div>
            </header>

            <!-- PAGE CONTENT AREA -->
            <main class="content-body" style="padding: 20px;">
                
                <!-- Food Record Form / Container Card -->
                <div class="card" style="max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
                    <div class="card-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h3 style="margin: 0; font-size: 18px; color: #1e293b;">Add Daily Food Record</h3>
                    </div>
                    
                    <form id="foodRecordForm">
                        <!-- Select Dish Dropdown -->
                        <div class="form-group" style="margin-bottom: 15px;">
                            <label style="display:block; margin-bottom:5px; font-size:14px; font-weight:500;">Select Dish</label>
                            <select id="dishSelect" style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; outline:none; background:white;" required>
                                <option value="">-- Loading Dishes --</option>
                            </select>
                        </div>

                        <div class="form-group" style="margin-bottom: 15px;">
                            <label style="display:block; margin-bottom:5px; font-size:14px; font-weight:500;">Record Date</label>
                            <input type="date" id="recDate" class="date-input" style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; outline:none;" required>
                        </div>
                        
                        <div class="form-group" style="margin-bottom: 15px;">
                            <label style="display:block; margin-bottom:5px; font-size:14px; font-weight:500;">Total Customers</label>
                            <input type="number" id="recCustomers" placeholder="e.g. 120" style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; outline:none;" required>
                        </div>
                        
                        <div class="form-group" style="margin-bottom: 15px;">
                            <label style="display:block; margin-bottom:5px; font-size:14px; font-weight:500;">Food Prepared (Containers)</label> <!-- Updated from kg to Containers -->
                            <input type="number" step="0.1" id="recPrepared" placeholder="e.g. 130.5" style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; outline:none;" required>
                        </div>
                        
                        <div class="form-group" style="margin-bottom: 20px;">
                            <label style="display:block; margin-bottom:5px; font-size:14px; font-weight:500;">Food Consumed (Containers)</label> <!-- Updated from kg to Containers -->
                            <input type="number" step="0.1" id="recConsumed" placeholder="e.g. 110.0" style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; outline:none;" required>
                        </div>
                        
                        <button type="submit" class="btn-primary" style="width:100%; padding:12px; background:#10b981; color:white; border:none; border-radius:6px; font-weight:600; cursor:pointer;">Save Record</button>
                    </form>
                </div>

            </main>
        </div>
    </div>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Your Main Script -->
    <script src="daily_data.js"></script>
</body>
</html>
